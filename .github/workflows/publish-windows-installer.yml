name: Publish Windows installer

on:
  push:
    tags: [v1.0.0]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-v1.0.0
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download and verify the tested installer
        shell: bash
        run: |
          set -euo pipefail
          ASSET=taffy-account-book-1.0.0-windows-x64-setup.exe
          BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/distribution/windows"
          curl --fail --location --retry 3 --output "$ASSET" "$BASE/$ASSET"
          curl --fail --location --retry 3 --output SHA256SUMS.txt "$BASE/SHA256SUMS.txt"
          curl --fail --location --retry 3 --output release-notes.md "$BASE/release-notes.md"
          sha256sum --check SHA256SUMS.txt
      - name: Publish installation download
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo 'Version v1.0.0 already exists; existing release will not be replaced.'
            exit 1
          fi
          gh release create v1.0.0 \
            taffy-account-book-1.0.0-windows-x64-setup.exe SHA256SUMS.txt \
            --verify-tag --title '永雏塔菲记账本 1.0.0 · Windows 安装包' \
            --notes-file release-notes.md --latest
